name = "Example for EGO1 FPGA board"
id = "example_ego1"

[directories]
constraints = ["src/constraints/"]
sources = ["src/modules/"]
simulation = ["sim/"]

[[simulation]]
id = "bin2bcd"
top-symbol = "tb_Bin2Bcd"
timescale = "1ns/1ps"

[[simulation]]
id = "bcd2seg7"
top-symbol = "tb_Bcd2Seg7"
timescale = "1ns/1ps"

[[simulation]]
id = "tb_driver7seg"
top-symbol = "tb_Driver7Seg"
timescale = "1ns/1ps"

[[fpga]]
id = "ego1"
part = "xc7a35tcsg324-1"

[[project]]
id = "driver7seg"
fpga = "ego1"
top-symbol = "Driver7Seg"
constraints = "xilinx.xdc"
